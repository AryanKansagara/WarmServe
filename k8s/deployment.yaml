apiVersion: apps/v1
kind: Deployment
metadata:
  name: warmserve-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: warmserve-demo}
  template:
    metadata:
      labels: {app: warmserve-demo}
    spec:
      containers:
        - name: gateway
          image: warmserve:local
          imagePullPolicy: Never
          ports: [{containerPort: 8088}]
          env:
            - {name: WARMSERVE_MAX_WORKERS, value: "2"}
            - {name: WARMSERVE_IDLE_TTL, value: "30s"}
          readinessProbe:
            httpGet: {path: /healthz, port: 8088}
          resources:
            requests: {cpu: "500m", memory: "512Mi"}
            limits: {cpu: "2", memory: "2Gi"}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
